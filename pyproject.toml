[project]
name = "luggage-storage-bot"
version = "0.1.0"
description = "Telegram bot for luggage storage managers"
readme = "README.md"
requires-python = "~=3.9.0"
dependencies = [
    "python-telegram-bot==11.1.0",
    "beautifulsoup4==4.13.3",
    "requests==2.32.4",
]
[dependency-groups]
dev = [
    "ruff>=0.15.20",
    "types-requests>=2.32.4.20260107",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/luggage_storage_bot"]
